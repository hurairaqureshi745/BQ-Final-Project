    </text>

    <line x1="250" y1="310" x2="450" y2="310" stroke="#273449" stroke-width="1" />

    <text x="350" y="340" font-family="'Inter', sans-serif" font-size="12" fill="#ec4899" font-weight="bold" letter-spacing="2" text-anchor="middle">
      UX DEEP DIVE
